services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: unless-stopped

  cron:
    image: alpine:3
    env_file:
      - .env
    depends_on:
      - app
    restart: unless-stopped
    entrypoint: >
      sh -c "apk add --no-cache curl &&
             echo '0 */2 * * * curl -s -X POST http://app:3000/api/cron/sync -H \"x-cron-secret: $${CRON_SECRET}\"' | crontab - &&
             crond -f -l 8"
